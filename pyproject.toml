[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hokoridub"
version = "0.1.0"
description = "Catálogo de personajes y voces de Hokori Dub"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
hokoridub = "hokoridub.cli:main"

[tool.setuptools]
packages = ["hokoridub"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
